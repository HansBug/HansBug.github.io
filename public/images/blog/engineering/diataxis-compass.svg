<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" role="img" aria-labelledby="title desc">
  <title id="title">Diátaxis compass: four documentation modes</title>
  <desc id="desc">A local schematic adapted from the Diátaxis compass, mapping Action versus Cognition and Acquisition versus Application to Tutorials, How-to guides, Reference, and Explanation.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .axis { stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .axis-soft { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 8; }
      .label { fill: #0f172a; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 700; }
      .small { fill: #475569; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 19px; }
      .mode { fill: #0f172a; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 31px; font-weight: 800; }
      .sub { fill: #64748b; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 18px; }
      .tutorial { fill: #e0f2fe; }
      .howto { fill: #dcfce7; }
      .reference { fill: #f1f5f9; }
      .explanation { fill: #fef3c7; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="920" height="620" rx="28" />
  <rect class="panel tutorial" x="110" y="90" width="330" height="190" rx="24" />
  <rect class="panel howto" x="480" y="90" width="330" height="190" rx="24" />
  <rect class="panel explanation" x="110" y="340" width="330" height="190" rx="24" />
  <rect class="panel reference" x="480" y="340" width="330" height="190" rx="24" />
  <line class="axis-soft" x1="460" y1="55" x2="460" y2="565" />
  <line class="axis-soft" x1="70" y1="310" x2="850" y2="310" />
  <line class="axis" x1="70" y1="575" x2="70" y2="65" />
  <line class="axis" x1="75" y1="575" x2="850" y2="575" />
  <text class="label" x="43" y="47" font-size="25" transform="rotate(-90 43 47)">Action</text>
  <text class="label" x="18" y="555" font-size="25" transform="rotate(-90 18 555)">Cognition</text>
  <text class="label" x="130" y="607" font-size="25">Acquisition</text>
  <text class="label" x="672" y="607" font-size="25">Application</text>
  <text class="mode" x="170" y="165">Tutorials</text>
  <text class="sub" x="157" y="202">action + acquisition</text>
  <text class="small" x="154" y="235">learn by being guided</text>
  <text class="mode" x="548" y="165">How-to guides</text>
  <text class="sub" x="542" y="202">action + application</text>
  <text class="small" x="548" y="235">complete a task</text>
  <text class="mode" x="578" y="415">Reference</text>
  <text class="sub" x="548" y="452">cognition + application</text>
  <text class="small" x="558" y="485">check exact facts</text>
  <text class="mode" x="170" y="415">Explanation</text>
  <text class="sub" x="160" y="452">cognition + acquisition</text>
  <text class="small" x="156" y="485">understand why</text>
  <text class="small" x="612" y="48">Based on the Diátaxis compass</text>
</svg>
