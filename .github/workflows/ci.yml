name: PR CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/mermaid-latex-support

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 运行单元测试
        run: npm test

      - name: 构建站点
        run: npm run build

      - name: 生成覆盖率
        run: npm run test:coverage

      - name: 上传 Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
